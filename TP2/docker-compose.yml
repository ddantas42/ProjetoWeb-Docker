services:
  # Servidor Web - único ponto de acesso (porta 80 exposta)
  web-server:
    build: Python_Server/
    container_name: projectweb-web
    depends_on:
      api-server:
        condition: service_healthy
    environment:
      DATA_SERVER_HOST: api-server
      DATA_SERVER_PORT: 5000
      DATA_SOCKET_PORT: 9000
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
    ports:
      - "80:80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API Server - Flask REST API e Sockets TCP (portas 5000 e 9000 internas)
  api-server:
    build: Data_Server/
    container_name: projectweb-api
    depends_on:
      db-server:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DB_HOST: db-server
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-projectweb}
      DB_USER: ${DB_USER:-projectweb}
      DB_PASSWORD: ${DB_PASSWORD:-projectweb}
      FLASK_DEBUG: "False"
    networks:
      - app-network
    expose:
      - "5000"
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Base de Dados - MariaDB
  db-server:
    image: mariadb:10.11
    container_name: projectweb-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-projectweb}
      MARIADB_USER: ${DB_USER:-projectweb}
      MARIADB_PASSWORD: ${DB_PASSWORD:-projectweb}
    networks:
      - app-network
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

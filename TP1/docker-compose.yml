services:
  python_server:
    build: Python_Server/
    depends_on:
      data_server:
        condition: service_started
    environment:
      DATA_SERVER_HOST: data_server
      DATA_SERVER_PORT: 5000
    ports:
      - "80:80"
    networks:
      - app-network

  data_server:
    build: Data_Server/
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-projectweb}
      DB_USER: ${DB_USER:-projectweb}
      DB_PASSWORD: ${DB_PASSWORD:-projectweb}
    networks:
      - app-network
    expose:
      - "5000"

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-projectweb}
      MARIADB_USER: ${MARIADB_USER:-projectweb}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-projectweb}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    expose:
      - "3306"

volumes:
  db_data:

networks:
  app-network:
    driver: bridge

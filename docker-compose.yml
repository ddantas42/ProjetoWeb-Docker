services:
  # Reverse proxy - unico ponto de acesso publico
  nginx:
    image: nginx:1.27-alpine
    container_name: projectweb-nginx
    depends_on:
      web-server:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./Nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Servidor Web - interface Flask interna
  web-server:
    build: Python_Server/
    container_name: projectweb-web
    depends_on:
      api-server:
        condition: service_healthy
    environment:
      DATA_SERVER_HOST: api-server
      DATA_SERVER_PORT: 5000
      DATA_SOCKET_PORT: 9000
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      IOT_REST_BASE_URL: ${IOT_REST_BASE_URL:-https://cjsg.ddns.net:8443}
      IOT_MQTT_HOST: ${IOT_MQTT_HOST:-cjsg.ddns.net}
      IOT_MQTT_PORT: ${IOT_MQTT_PORT:-1883}
      IOT_MQTT_USER: ${IOT_MQTT_USER:-}
      IOT_MQTT_PASSWORD: ${IOT_MQTT_PASSWORD:-}
    expose:
      - "80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:80/login').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API Server - Flask REST API e Sockets TCP internos
  api-server:
    build: Data_Server/
    container_name: projectweb-api
    depends_on:
      db-server:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DB_HOST: db-server
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-projectweb}
      DB_USER: ${DB_USER:-projectweb}
      DB_PASSWORD: ${DB_PASSWORD:-projectweb}
      FLASK_DEBUG: "False"
    networks:
      - app-network
    expose:
      - "5000"
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Base de Dados - MariaDB
  db-server:
    image: mariadb:10.11
    container_name: projectweb-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-projectweb}
      MARIADB_USER: ${DB_USER:-projectweb}
      MARIADB_PASSWORD: ${DB_PASSWORD:-projectweb}
    networks:
      - app-network
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

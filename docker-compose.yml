services:
  # Servidor Web - único ponto de acesso (porta 80 exposta)
  web-server:
    build: Python_Server/
    container_name: projectweb-web
    depends_on:
      data-server:
        condition: service_healthy
    environment:
      DATA_SERVER_HOST: data-server
      DATA_SERVER_PORT: 5000
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
    ports:
      - "80:80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Servidor de Dados + BD - não expõe portas ao host
  data-server:
    build: Data_Server/
    container_name: projectweb-api
    environment:
      FLASK_ENV: production
      DB_HOST: localhost
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-projectweb}
      DB_USER: ${DB_USER:-projectweb}
      DB_PASSWORD: ${DB_PASSWORD:-projectweb}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-projectweb}
      MARIADB_USER: ${MARIADB_USER:-projectweb}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-projectweb}
      FLASK_DEBUG: "False"
    networks:
      - app-network
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
